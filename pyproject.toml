[project]
name = "url-shortener"
version = "0.1.0"
description = "A small FastAPI and PostgreSQL URL shortener"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.20.0",
  "anyio==4.15.1",
  "fastapi==0.141.1",
  "psycopg[binary]==3.3.6",
  "pydantic==2.13.5",
  "sqlalchemy==2.0.54",
  "uvicorn[standard]==0.53.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "ruff==0.16.8",
  "ty==0.0.84",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "integration: exercises migrations and database boundaries",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
