[project]
name = "url-shortener"
version = "0.1.0"
description = "A small FastAPI and PostgreSQL URL shortener"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.20.1",
  "anyio==4.16.0",
  "fastapi==0.162.0",
  "psycopg[binary]==3.3.8",
  "pydantic==2.14.3",
  "sqlalchemy==2.1.8",
  "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.2.0",
  "ruff==0.17.4",
  "ty==0.0.98",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "integration: exercises migrations and database boundaries",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
