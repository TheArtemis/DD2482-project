[project]
name = "url-shortener"
version = "0.1.0"
description = "A small FastAPI and PostgreSQL URL shortener"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.15.2",
  "anyio==4.9.0",
  "fastapi==0.115.12",
  "psycopg[binary]==3.2.9",
  "pydantic==2.11.5",
  "sqlalchemy==2.0.41",
  "uvicorn[standard]==0.34.2",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.5",
  "ruff==0.11.12",
  "ty==0.0.84",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "integration: exercises migrations and database boundaries",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
