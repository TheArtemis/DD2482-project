apiVersion: batch/v1
kind: Job
metadata:
  name: url-shortener-migration
  namespace: url-shortener
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: url-shortener
    spec:
      restartPolicy: Never
      containers:
        - name: migration
          image: urlshortenerpf9nt4acr.azurecr.io/url-shortener:deploy
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: url-shortener-config
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
