apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener
  namespace: url-shortener
  labels:
    app.kubernetes.io/name: url-shortener
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: url-shortener
  template:
    metadata:
      labels:
        app.kubernetes.io/name: url-shortener
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: url-shortener
      containers:
        - name: app
          image: urlshortenerpf9nt4acr.azurecr.io/url-shortener:deploy
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_HOST
              value: "0.0.0.0"
            - name: APP_PORT
              value: "8000"
            - name: GIT_SHA
              value: "deploy"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: url-shortener-config
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
