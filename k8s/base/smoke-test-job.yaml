apiVersion: batch/v1
kind: Job
metadata:
  name: url-shortener-smoke-test
  namespace: url-shortener
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: url-shortener
    spec:
      restartPolicy: Never
      containers:
        - name: smoke-test
          image: urlshortenerpf9nt4acr.azurecr.io/url-shortener:deploy
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/scripts/smoke_test.py"]
          env:
            - name: SMOKE_TEST_BASE_URL
              value: http://url-shortener
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
